<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dot Shopping Center</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🛍️ Dot Shopping Center</h1>

    <button onclick="viewCart()">
        🛒 Cart (<span id="cart-count">0</span>)
    </button>

    <p>Your Online Marketplace</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="#products">Products</a>
    <a href="#categories">Categories</a>
    <a href="#contact">Contact</a>
    <a href="login.html">Login</a>
    <a href="seller.html">Seller Dashboard</a>
</nav>

<div class="search-box">
    <input
        type="text"
        id="searchInput"
        placeholder="Search products..."
        oninput="searchProducts()"
    >

    <button onclick="searchProducts()">
        🔍 Search
    </button>
</div>

<section id="products">
    <h2>🛍️ Products</h2>

    <div id="products-container">
        <p>Loading products...</p>
    </div>
</section>

<section id="categories">
    <h2>📦 Categories</h2>

    <p>
        Electronics • Fashion • Home • Gaming • Accessories
    </p>
</section>

<section id="contact">
    <h2>📞 Contact</h2>

    <p>
        Welcome to Dot Shopping Center.
    </p>
</section>

<footer>
    <p>
        © 2026 Dot Shopping Center. All Rights Reserved.
    </p>
</footer>

<script type="module" src="script.js?v=2"></script>

</body>
</html>
