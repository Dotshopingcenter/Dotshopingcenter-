<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dot Shopping Center</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>🛍️ Dot Shopping Center</h1>
<button onclick="viewCart()">🛒 Cart (<span id="cart-count">0</span>)</button>
    <p>Your Online Marketplace</p>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">Products</a>
    <a href="#">Categories</a>
    <a href="#">Contact</a>
    <a href="login.html">Login</a>
</nav>
    <div class="search-box">
    <input type="text" placeholder="Search products...">
    <button>Search</button>
    </div>

<section>
  <h2>Featured Products</h2>
    
<div class="product">
  <img src="shopping.webp" alt="iPhone 15"> 
    <h3>iPhone 15</h3>
    <p>Price: $999</p>
    <button onclick="addToCart('Gaming Laptop')">Add to Cart</button>
</div>

<div class="product">
    <h3>Gaming Laptop</h3>
    <p>Price: $1200</p>
    <button>Buy Now</button>
</div>

<div class="product">
    <h3>Wireless Headphones</h3>
    <p>Price: $149</p>
  <button onclick="addToCart('Wireless Headphones')">Add to Cart</button>
</div>  

<footer>
    <p>© 2026 Dot Shopping Center. All Rights Reserved.</p>
</footer>

<script type="module" src="script.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD5F0neUZryQSzxO3o8XpNdnWpeDxwuImo",
  authDomain: "dot-shopping-center.firebaseapp.com",
  projectId: "dot-shopping-center",
  storageBucket: "dot-shopping-center.firebasestorage.app",
  messagingSenderId: "673341901162",
  appId: "1:673341901162:web:eab55a275f11015e1a7d13"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

async function loadProducts() {
  const snapshot = await getDocs(collection(db, "products"));
  console.log(snapshot.docs.map(doc => doc.data()));
}

loadProducts();
</script>

</body>
</html>
