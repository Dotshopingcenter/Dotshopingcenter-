<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Dot Shopping Center</title>
</head>

<body>

    <h1>Create Your Dot Shopping Center Account</h1>

    <form id="registerForm">

        <input
            type="text"
            id="name"
            placeholder="Full Name"
            required
        >
        <br><br>

        <input
            type="email"
            id="email"
            placeholder="Email Address"
            required
        >
        <br><br>

        <input
            type="password"
            id="password"
            placeholder="Password (at least 6 characters)"
            minlength="6"
            required
        >
        <br><br>

        <button type="submit">Create Account</button>

    </form>

    <p id="message"></p>

    <p>
        Already have an account?
        <a href="login.html">Login here</a>
    </p>

    <p><a href="index.html">Back to Home</a></p>

    <script type="module">

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

        import {
            getAuth,
            createUserWithEmailAndPassword,
            updateProfile
        } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD5F0neUZryQSzxO3o8XpNdnWpeDxwuImo",
            authDomain: "dot-shopping-center.firebaseapp.com",
            projectId: "dot-shopping-center",
            storageBucket: "dot-shopping-center.firebasestorage.app",
            messagingSenderId: "673341901162",
            appId: "1:673341901162:web:eab55a275f11015e1a7d13"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        document.getElementById("registerForm").addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                const name =
                    document.getElementById("name").value.trim();

                const email =
                    document.getElementById("email").value.trim();

                const password =
                    document.getElementById("password").value;

                const message =
                    document.getElementById("message");

                message.textContent = "Creating your account...";

                try {

                    const result =
                        await createUserWithEmailAndPassword(
                            auth,
                            email,
                            password
                        );

                    await updateProfile(result.user, {
                        displayName: name
                    });

                    message.textContent =
                        "Account created successfully! You can now log in.";

                    document.getElementById("registerForm").reset();

                } catch (error) {

                    console.error(error);

                    if (error.code === "auth/email-already-in-use") {
                        message.textContent =
                            "This email already has an account. Please log in.";
                    } else if (error.code === "auth/invalid-email") {
                        message.textContent =
                            "Please enter a valid email address.";
                    } else {
                        message.textContent =
                            "Registration failed: " + error.message;
                    }

                }

            }
        );

    </script>

</body>
</html>
